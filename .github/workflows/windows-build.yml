name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - name: Run tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'src'
          python -m pytest -q tests
      - name: Build Windows package
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --name PromptLibrary --paths src src/prompt_library/__main__.py
      - name: Upload package output
        uses: actions/upload-artifact@v4
        with:
          name: PromptLibrary-windows
          path: dist/PromptLibrary.exe
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Prompt Library ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/PromptLibrary.exe